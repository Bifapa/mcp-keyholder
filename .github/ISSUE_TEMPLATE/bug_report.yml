name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems: please report them privately, see SECURITY.md. Never paste key values here."
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About
      placeholder: "1.0.0, portable mode"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
